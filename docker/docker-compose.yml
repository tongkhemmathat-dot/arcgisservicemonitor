# Base config — use with an env override:
#   dev:     docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   staging: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#   prod:    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      CONFIG_PATH: "/data/config.json"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"   # optional — auto-generated if blank
    # dns: ระบุ DNS ของ network ภายในองค์กร เพื่อให้ resolve hostname เช่น mail gateway
    # หากไม่ระบุ container จะใช้ 8.8.8.8 ซึ่งอาจ resolve internal hostname ไม่ได้
    dns:
      - ${INTERNAL_DNS:-8.8.8.8}
    volumes:
      - arcgis-data:/data

  frontend:
    image: nginx:alpine
    depends_on:
      - backend
    dns:
      - ${INTERNAL_DNS:-8.8.8.8}
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  arcgis-data:
